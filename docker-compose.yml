version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chaussettes-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SSL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Configuration SSL
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.server.keystore.jks
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.server.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: password
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_password
      KAFKA_SSL_KEY_PASSWORD: password
      KAFKA_SSL_KEY_CREDENTIALS: key_password
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: password
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_password
      KAFKA_SSL_CLIENT_AUTH: none
      # Augmenter les limites de taille des messages
      KAFKA_MESSAGE_MAX_BYTES: 1073741824
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1073741824
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1073741824
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1073741824
      KAFKA_FETCH_MAX_BYTES: 1073741824
      # Configuration des topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Configuration réseau pour éviter les timeouts
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 1073741824
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - chaussettes-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-topics-setup:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    networks:
      - chaussettes-network
    restart: "no"
    command: >
      sh -c "
        echo '⏳ Attente que Kafka soit disponible...' &&
        until kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null; do
          echo 'Kafka pas encore prêt...'; sleep 5;
        done &&
        echo '✅ Kafka disponible. Création des topics...' &&
        kafka-topics --bootstrap-server kafka:9092 --create --topic http-logs --partitions 3 --replication-factor 1 --if-not-exists &&
        kafka-topics --bootstrap-server kafka:9092 --create --topic alerts --partitions 2 --replication-factor 1 --if-not-exists &&
        echo '🎉 Topics créés avec succès'
      "

  log-generator:
    build:
      context: ./utils
    depends_on:
      - kafka-topics-setup
    volumes:
      - ./secrets:/secrets:ro
    networks:
      - chaussettes-network
    environment:
      KAFKA_BROKER: kafka:9092
    restart: unless-stopped
    command: ["python", "genlogs_v2.py", "--mode", "production", "--rate", "50", "--urls", "1000", "--kafka-broker", "kafka:9092"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep genlogs_v2.py | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  log-analyzer:
    build:
      context: ./spark-streaming
    depends_on:
      kafka-topics-setup:
        condition: service_completed_successfully
    networks:
      - chaussettes-network
    volumes:
      - ./output:/app/output
      - ./checkpoint:/app/checkpoint
      - ./secrets:/secrets:ro
    environment:
      KAFKA_BROKER: kafka:9092
      SPARK_DRIVER_MEMORY: 1g
      SPARK_EXECUTOR_MEMORY: 1g
    restart: unless-stopped
    command: ["python", "log_analyzer.py", "--mode", "production", "--kafka-broker", "kafka:9092"]
    mem_limit: 2g

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - chaussettes-network

volumes:
  kafka-data:

networks:
  chaussettes-network:
    driver: bridge
